<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse seu espaço SoftSkill.">
    <title>Entrar | SoftSkill</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <section class="auth-art" aria-label="SoftSkill">
        <div class="art-grid"></div>
        <div class="art-content">
            <p class="eyebrow">SoftSkill / 01</p>
            <h1 class="art-title">Pequenas mudanças. Mais presença.</h1>
            <p class="art-copy">Um lugar para transformar intenção em prática e levar suas habilidades humanas para a
                vida real.</p>
        </div>
    </section>

    <main class="auth-panel">
        <div class="auth-card">
          ><img src="logo.jpeg" alt="Logo da empresa">
            <h2 class="auth-heading" id="form-title">Entre no seu espaço.</h2>
            <p class="auth-subtitle" id="form-subtitle">Um espaço simples para você seguir em movimento.</p>

            <form id="login-form">
                <label class="field" for="email">
                    E-mail
                    <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                </label>
                <label class="field" for="password">
                    Senha
                    <input id="password" type="password" autocomplete="current-password"
                        placeholder="Mínimo de 6 caracteres" minlength="6" required>
                </label>
                <button class="primary-button" type="submit"><span id="submit-label">Entrar</span></button>
                <p id="login-feedback" class="feedback" role="status" aria-live="polite"></p>
            </form>

            <p class="switch-mode">Ainda não tem uma conta? <button class="text-button" id="mode-button"
                    type="button">Criar uma conta</button></p>
        </div>
    </main>

    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
</body>

</html>
